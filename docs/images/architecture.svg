<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="630" viewBox="0 0 1000 630" role="img" aria-labelledby="title desc">
<title id="title">QEMU DMA Lab architecture</title>
<desc id="desc">A userspace application submits ioctl requests to a Linux platform driver. The driver configures a QEMU DMA device through MMIO and receives completion interrupts. The driver and emulated device access coherent source and destination buffers in guest RAM.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker>
  <style>
    text{font-family:Arial,Helvetica,sans-serif;fill:#172b4d}
    .title{font-size:26px;font-weight:700}
    .name{font-size:21px;font-weight:700}
    .sub{font-size:15px;fill:#475569}
    .label{font-size:15px;font-weight:600;fill:#475569}
    .line{fill:none;stroke:#475569;stroke-width:2;marker-end:url(#arrow)}
  </style>
</defs>
<rect width="1000" height="630" rx="16" fill="#ffffff"/>
<text x="50" y="49" class="title">QEMU DMA Lab</text>
<text x="50" y="76" class="sub">Synchronous ioctl API · interrupt-driven completion</text>

<rect x="60" y="105" width="425" height="95" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
<text x="272" y="141" text-anchor="middle" class="name">Userspace Application</text>
<text x="272" y="171" text-anchor="middle" class="sub">/dev/philip_dma</text>

<rect x="60" y="280" width="425" height="110" rx="12" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.5"/>
<text x="272" y="316" text-anchor="middle" class="name">Linux Platform Driver</text>
<text x="272" y="347" text-anchor="middle" class="sub">xfer_lock · completion · coherent buffers</text>
<text x="272" y="372" text-anchor="middle" class="sub">philip_dma_drv.c</text>

<rect x="60" y="480" width="425" height="100" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
<text x="272" y="519" text-anchor="middle" class="name">QEMU DMA Device</text>
<text x="272" y="551" text-anchor="middle" class="sub">MMIO registers · virtual timer · IRQ</text>

<rect x="700" y="280" width="255" height="300" rx="12" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
<text x="827" y="320" text-anchor="middle" class="name">Guest RAM</text>
<text x="827" y="348" text-anchor="middle" class="sub">Coherent DMA buffers</text>
<rect x="725" y="379" width="205" height="61" rx="8" fill="#ffffff" stroke="#fcd34d"/>
<text x="827" y="415" text-anchor="middle" class="label">Source buffer</text>
<rect x="725" y="472" width="205" height="61" rx="8" fill="#ffffff" stroke="#fcd34d"/>
<text x="827" y="508" text-anchor="middle" class="label">Destination buffer</text>

<path d="M180 200V280" class="line"/>
<text x="163" y="243" text-anchor="end" class="label">ioctl request</text>
<path d="M375 280V200" class="line"/>
<text x="392" y="243" class="label">Result</text>

<path d="M180 390V480" class="line"/>
<text x="163" y="430" text-anchor="end" class="label">MMIO</text>
<text x="163" y="450" text-anchor="end" class="sub">configuration</text>
<path d="M375 480V390" class="line"/>
<text x="392" y="429" class="label">Completion</text>
<text x="392" y="450" class="sub">IRQ</text>

<path d="M485 335H700" class="line" marker-start="url(#arrow)"/>
<text x="592" y="309" text-anchor="middle" class="label">Prepare / collect</text>
<path d="M485 530H700" class="line" marker-start="url(#arrow)"/>
<text x="592" y="493" text-anchor="middle" class="label">DMA read / write</text>
<text x="592" y="513" text-anchor="middle" class="sub">Emulated memory access</text>
<text x="50" y="613" class="sub">Logical view: QEMU emulates the device; the driver and application run in the Linux guest.</text>
</svg>
